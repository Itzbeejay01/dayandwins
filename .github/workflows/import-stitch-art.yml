name: Vendor original Stitch illustrations

on:
  push:
    branches:
      - feature/stitch-days-wins-mvp

permissions:
  contents: write

jobs:
  vendor-art:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/stitch-days-wins-mvp
          persist-credentials: true
      - name: Setup PHP with GD
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: gd
      - name: Import original Stitch art
        run: php scripts/cache-stitch-art.php
      - name: Commit images on feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/stitch-journal.png public/brand/stitch-trophy.png public/brand/stitch-flame.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: bundle original Stitch 3D illustrations"
            git push origin HEAD:feature/stitch-days-wins-mvp
          fi
