name: Normalize Days & Wins PHP

on:
  push:
    branches:
      - feature/stitch-days-wins-mvp

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/stitch-days-wins-mvp
          persist-credentials: true
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer install --no-scripts --no-interaction --prefer-dist
      - run: vendor/bin/pint app/Http/Controllers/JournalController.php app/Models/JournalEntry.php database/migrations/2026_10_23_103800_create_journal_entries_table.php scripts/cache-stitch-art.php scripts/generate-native-assets.php
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/Http/Controllers/JournalController.php app/Models/JournalEntry.php database/migrations/2026_10_23_103800_create_journal_entries_table.php scripts/cache-stitch-art.php scripts/generate-native-assets.php
            git commit -m "style: normalize PHP with Laravel Pint"
            git push origin HEAD:feature/stitch-days-wins-mvp
          fi
