name: Finish formatting Days & Wins

on:
  push:
    branches:
      - feature/stitch-days-wins-mvp

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/stitch-days-wins-mvp
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npx vp fmt resources/js/pages/days-wins.tsx --write
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add resources/js/pages/days-wins.tsx
            git commit -m "style: normalize local Stitch artwork paths"
            git push origin HEAD:feature/stitch-days-wins-mvp
          fi
