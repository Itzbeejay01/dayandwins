name: Normalize Days & Wins feature code

on:
  push:
    branches:
      - feature/stitch-days-wins-mvp

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/stitch-days-wins-mvp
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install tooling
        run: npm ci
      - name: Format using repository Vite+ configuration
        run: npx vp fmt . --write
      - name: Commit formatting to feature branch only
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md resources/js/pages/days-wins.css resources/js/pages/days-wins.tsx resources/js/components/brand-splash.tsx resources/js/layouts/auth/auth-simple-layout.tsx resources/js/layouts/days-wins-settings-layout.tsx
            git commit -m "style: format completed mobile settings and design"
            git push origin HEAD:feature/stitch-days-wins-mvp
          fi
